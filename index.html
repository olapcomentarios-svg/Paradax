
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Paradax: una pequeña colección de juegos para disfrutar directamente en el navegador.">
    <title>Paradax — Juegos en el navegador</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #08090c;
            --surface: #12141a;
            --text: #f7f5ef;
            --muted: #a8abb5;
            --accent: #ff4d4d;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 10%, rgba(255, 77, 77, 0.14), transparent 28rem),
                radial-gradient(circle at 85% 80%, rgba(70, 155, 255, 0.1), transparent 30rem),
                var(--background);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .page {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
            padding: 72px 0 48px;
        }

        header {
            margin-bottom: 42px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(3rem, 9vw, 6.5rem);
            line-height: 0.95;
            letter-spacing: -0.07em;
        }

        .intro {
            max-width: 590px;
            margin: 22px 0 0;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.6;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .game-card {
            position: relative;
            min-height: 430px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            color: inherit;
            background: var(--surface);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
            text-decoration: none;
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.42);
        }

        .game-card:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 5px;
        }

        .game-card img {
            width: 100%;
            height: 285px;
            display: block;
            object-fit: cover;
            transition: transform 350ms ease;
        }

        .game-card:hover img {
            transform: scale(1.025);
        }

        .game-card--balatro img {
            object-position: center 46%;
        }

        .card-content {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: end;
            gap: 20px;
            padding: 24px;
        }

        .card-label {
            margin: 0 0 7px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        h2 {
            margin: 0;
            font-size: clamp(1.6rem, 4vw, 2.25rem);
            letter-spacing: -0.04em;
        }

        .play {
            display: inline-grid;
            width: 48px;
            height: 48px;
            place-items: center;
            flex: 0 0 auto;
            border-radius: 50%;
            color: #0a0a0a;
            background: var(--text);
            font-size: 1.15rem;
            transition: color 180ms ease, background 180ms ease;
        }

        .game-card:hover .play {
            color: #fff;
            background: var(--accent);
        }

        footer {
            margin-top: 38px;
            color: #70737d;
            font-size: 0.85rem;
        }

        @media (max-width: 720px) {
            .page {
                width: min(100% - 28px, 540px);
                padding-top: 46px;
            }

            .games {
                grid-template-columns: 1fr;
            }

            .game-card {
                min-height: 0;
            }

            .game-card img {
                height: 240px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <p class="eyebrow">Juega en el navegador</p>
            <h1>Paradax</h1>
            <p class="intro">Una pequeña colección de juegos. Elige uno, pulsa jugar y entra directamente en la partida.</p>
        </header>

        <section class="games" aria-label="Juegos disponibles">
            <a class="game-card game-card--pitt" href="project-pitt/index.html">
                <img src="project-pitt/index.png" alt="Project P.I.T.T, con un pato naranja sobre un fondo rojo">
                <div class="card-content">
                    <div>
                        <p class="card-label">Nuevo · Godot</p>
                        <h2>Project P.I.T.T</h2>
                    </div>
                    <span class="play" aria-hidden="true">▶</span>
                </div>
            </a>

            <a class="game-card game-card--balatro" href="balatro/index.html">
                <img src="balatro/theme/bg.png" alt="Ilustración de Balatro con cartas y fichas sobre fondo rosa y azul">
                <div class="card-content">
                    <div>
                        <p class="card-label">Clásico · Cartas</p>
                        <h2>Balatro</h2>
                    </div>
                    <span class="play" aria-hidden="true">▶</span>
                </div>
            </a>
        </section>

        <footer>Dos juegos. Cero instalaciones.</footer>
    </main>
</body>
</html>
