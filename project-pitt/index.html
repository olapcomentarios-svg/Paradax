		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<!-- Port web de Project P.I.T.T. (uso personal local). Se inyecta en <head> vía html/head_include. -->
<style>
	#pitt-overlay {
		position: fixed; inset: 0; z-index: 10;
		display: flex; align-items: center; justify-content: center; text-align: center;
		background: rgba(0, 0, 0, 0.78); color: #ffb000; cursor: pointer;
		font: bold 28px/1.4 monospace; letter-spacing: 2px; user-select: none;
	}
	#pitt-overlay[hidden] { display: none; }
	#pitt-overlay small { display: block; font-size: 15px; color: #c8c8c8; letter-spacing: 0; }
</style>
<script>
(function () {
	"use strict";
	let started = false;
	let wantLock = false;   // Godot ha pedido capturar el puntero y no lo ha soltado
	let godotExit = false;  // el próximo "pointerlockchange" lo provoca Godot, no el navegador

	// Godot pide/suelta el puntero con estas dos llamadas: se envuelven para saber quién lo suelta.
	const origExit = document.exitPointerLock.bind(document);
	document.exitPointerLock = function () {
		wantLock = false;
		if (document.pointerLockElement) godotExit = true;
		return origExit();
	};
	const origRequest = HTMLCanvasElement.prototype.requestPointerLock;
	HTMLCanvasElement.prototype.requestPointerLock = function (...args) {
		wantLock = true;
		const result = origRequest.apply(this, args);
		if (result && typeof result.catch === "function") result.catch(() => showResume());
		return result;
	};

	function canvas() { return document.getElementById("canvas"); }

	function overlay() {
		let el = document.getElementById("pitt-overlay");
		if (!el) {
			el = document.createElement("div");
			el.id = "pitt-overlay";
			el.addEventListener("click", onOverlayClick);
			document.body.appendChild(el);
		}
		return el;
	}

	function showStart() {
		overlay().innerHTML = "<div>CLICK PARA JUGAR<small>Esc suelta el ratón y pausa la partida</small></div>";
		overlay().hidden = false;
	}

	function showResume() {
		if (!started || document.pointerLockElement || !wantLock) return;
		overlay().innerHTML = "<div>CLICK PARA CONTINUAR<small>El navegador ha soltado el ratón</small></div>";
		overlay().hidden = false;
	}

	function onOverlayClick() {
		overlay().hidden = true;
		const c = canvas();
		if (c) c.focus();
		if (!started) {
			started = true;  // este clic es el gesto que desbloquea el audio del navegador
		} else if (wantLock && c) {
			c.requestPointerLock();
		}
	}

	document.addEventListener("pointerlockchange", () => {
		if (document.pointerLockElement) {
			if (started) overlay().hidden = true;
			return;
		}
		if (godotExit) { godotExit = false; return; }
		// Lo ha soltado el navegador (Esc, cambio de pestaña, Alt+Tab): que el juego decida (pausa).
		if (wantLock && typeof window.pittOnPointerLockLost === "function") window.pittOnPointerLockLost();
		// Si el juego no ha pasado a ratón libre (no ha llamado a exitPointerLock), ofrecer recaptura.
		setTimeout(showResume, 300);
	});
	document.addEventListener("pointerlockerror", () => setTimeout(showResume, 50));

	window.addEventListener("DOMContentLoaded", showStart);
})();
</script>

	</head>
	<body>

		<script>
// Los dos binarios de Godot se guardan en fragmentos menores de 25 MB.
// Este cargador los vuelve a exponer al motor como un único flujo de datos.
const SPLIT_ASSETS = {
	'index.pck': {
		parts: ['index.pck.part0', 'index.pck.part1', 'index.pck.part2', 'index.pck.part3'],
		size: 83693452,
		type: 'application/octet-stream',
	},
	'index.wasm': {
		parts: ['index.wasm.part0', 'index.wasm.part1'],
		size: 37700666,
		type: 'application/wasm',
	},
};

const nativeFetch = window.fetch.bind(window);

window.fetch = async function fetchSplitAsset(input, init) {
	const requestUrl = typeof input === 'string'
		? input
		: input instanceof URL
			? input.href
			: input.url;
	const assetName = new URL(requestUrl, window.location.href).pathname.split('/').pop();
	const asset = SPLIT_ASSETS[assetName];

	if (!asset) {
		return nativeFetch(input, init);
	}

	const stream = new ReadableStream({
		async start(controller) {
			try {
				for (const part of asset.parts) {
					const response = await nativeFetch(new URL(part, window.location.href), init);
					if (!response.ok || !response.body) {
						throw new Error(`No se pudo cargar ${part} (${response.status}).`);
					}

					const reader = response.body.getReader();
					while (true) {
						const { done, value } = await reader.read();
						if (done) break;
						controller.enqueue(value);
					}
				}
				controller.close();
			} catch (error) {
				controller.error(error);
			}
		},
	});

	return new Response(stream, {
		status: 200,
		headers: {
			'Content-Length': String(asset.size),
			'Content-Type': asset.type,
		},
	});
};
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":83693452,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
